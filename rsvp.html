<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Confirmação de Presença - Casamento Maria & Lucas</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary-color: #7A8B7B;
      --accent-color: #D8A49B;
      --accent-hover: #C58F86;
      --bg-color: #F8F9F7;
      --card-bg: #FFFFFF;
      --text-color: #38423B;
      --text-muted: #6C7A6E;
      --border-color: #E2E8E3;
      
      --font-title: 'Playfair Display', Georgia, serif;
      --font-body: 'Montserrat', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.6;
      padding: 40px 20px;
    }

    .rsvp-card {
      max-width: 550px;
      margin: 0 auto;
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid var(--border-color);
      box-shadow: 0 8px 25px rgba(122, 139, 123, 0.08);
      padding: 35px 30px;
    }

    h1 {
      font-family: var(--font-title);
      color: var(--primary-color);
      font-size: 1.8rem;
      text-align: center;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: 500;
      margin-bottom: 8px;
      font-size: 0.95rem;
    }

    select, input[type="text"], input[type="tel"], input[type="email"], input[type="number"] {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-family: var(--font-body);
      font-size: 0.95rem;
      background: #fff;
    }

    .names-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
    }

    .radio-group {
      display: flex;
      gap: 20px;
      margin-top: 8px;
    }

    .radio-group label {
      font-weight: normal;
      cursor: pointer;
    }

    .btn-enviar {
      display: block;
      width: 100%;
      padding: 14px;
      background-color: var(--primary-color);
      color: #FFF;
      border: none;
      border-radius: 25px;
      font-weight: 600;
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      margin-top: 30px;
      transition: background 0.2s;
    }

    .btn-enviar:hover {
      background-color: #687769;
    }

    .success-box {
      display: none;
      text-align: center;
      padding: 20px 0;
    }

    .success-box h2 {
      font-family: var(--font-title);
      color: var(--primary-color);
      margin-bottom: 15px;
    }

    .btn-voltar {
      display: inline-block;
      margin-top: 20px;
      background: var(--accent-color);
      color: #fff;
      padding: 10px 25px;
      border-radius: 20px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.85rem;
      text-transform: uppercase;
    }

    .btn-voltar:hover {
      background: var(--accent-hover);
    }
  </style>
</head>
<body>

  <div class="rsvp-card">
    <h1>Confirmação de Presença</h1>

    <form id="rsvpForm" onsubmit="enviarRSVP(event)">
      <!-- Pergunta 1: Quantidade de Pessoas -->
      <div class="form-group">
        <label for="numPessoas">Número de pessoas que irão lhe acompanhar (incluindo você):</label>
        <select id="numPessoas" required onchange="gerarCamposNomes()">
          <option value="" disabled selected>Selecione...</option>
          <option value="1">1 pessoa</option>
          <option value="2">2 pessoas</option>
          <option value="3">3 pessoas</option>
          <option value="4">4 pessoas</option>
          <option value="5">5 pessoas</option>
          <option value="6">6 pessoas</option>
          <option value="7">7 pessoas</option>
          <option value="8">8 pessoas</option>
          <option value="9">9 pessoas</option>
          <option value="10">10 pessoas</option>
        </select>
      </div>

      <!-- Campos Dinâmicos para os Nomes -->
      <div class="form-group" id="grupoNomes" style="display: none;">
        <label>Informe o nome completo de cada participante:</label>
        <div id="camposNomes" class="names-container"></div>
      </div>

      <!-- Pergunta 2: Crianças até 6 anos -->
      <div class="form-group">
        <label>Algum dos seus acompanhantes é criança (de até 6 anos)?</label>
        <div class="radio-group">
          <label><input type="radio" name="temCrianca" value="sim" onclick="toggleCriancas(true)"> Sim</label>
          <label><input type="radio" name="temCrianca" value="nao" onclick="toggleCriancas(false)" checked> Não</label>
        </div>
      </div>

      <div class="form-group" id="grupoQtdCriancas" style="display: none;">
        <label for="qtdCriancas">Quantas crianças de até 6 anos?</label>
        <input type="number" id="qtdCriancas" min="1" max="10" value="0">
      </div>

      <!-- Contato: Celular (Obrigatório) -->
      <div class="form-group">
        <label for="celular">Número de celular para contato (com DDD):</label>
        <input type="tel" id="celular" placeholder="(15) 99999-9999" required>
      </div>

      <!-- Contato: E-mail (Opcional) -->
      <div class="form-group">
        <label for="email">E-mail (opcional):</label>
        <input type="email" id="email" placeholder="seuemail@exemplo.com">
      </div>

      <button type="submit" class="btn-enviar">Confirmar Presença</button>
    </form>

    <!-- Mensagem de Sucesso -->
    <div id="successBox" class="success-box">
      <h2>Presença Confirmada com Sucesso!</h2>
      <p style="color: var(--text-muted); margin-bottom: 20px;">Agradecemos imensamente a sua confirmação. Estamos contando os dias para celebrar este momento inesquecível com você!</p>
      <a href="index.html" class="btn-voltar">Voltar para a página principal</a>
    </div>

  </div>

  <script>
    function gerarCamposNomes() {
      const qtd = parseInt(document.getElementById('numPessoas').value);
      const container = document.getElementById('camposNomes');
      const grupo = document.getElementById('grupoNomes');
      container.innerHTML = '';
      
      if (qtd > 0) {
        grupo.style.display = 'block';
        for (let i = 1; i <= qtd; i++) {
          const input = document.createElement('input');
          input.type = 'text';
          input.placeholder = `Nome da ${i}ª pessoa (incluindo você)`;
          input.required = true;
          container.appendChild(input);
        }
      }
    }

    function toggleCriancas(mostrar) {
      document.getElementById('grupoQtdCriancas').style.display = mostrar ? 'block' : 'none';
    }

    function enviarRSVP(event) {
      event.preventDefault();
      // Salvar os dados localmente ou processar
      document.getElementById('rsvpForm').style.display = 'none';
      document.getElementById('successBox').style.display = 'block';
    }
  </script>

</body>
</html>
