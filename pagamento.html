<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Confirmar Presente</title>
  
  <!-- Fonte Elegante Padronizada -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      /* Paleta Verde & Rosa */
      --primary-color: #7A8B7B;
      --accent-color: #D8A49B;
      --accent-hover: #C58F86;
      --bg-color: #F8F9F7;
      --card-bg: #FFFFFF;
      --text-color: #38423B;
      --border-color: #E2E8E3;
      
      --font-title: 'Playfair Display', Georgia, serif;
      --font-body: 'Montserrat', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 40px 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .checkout-card {
      width: 100%;
      max-width: 480px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 30px 20px;
      box-shadow: 0 10px 30px rgba(122, 139, 123, 0.08);
      text-align: center;
    }

    h1 {
      font-family: var(--font-title);
      color: var(--primary-color);
      margin-bottom: 20px;
      font-size: 2rem;
      font-weight: 600;
    }

    .img-preview-container {
      width: 100%;
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      background-color: #FFFFFF;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      padding: 10px;
    }

    .img-preview-container img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .info-presente {
      background-color: #F2F5F3;
      border: 1px dashed var(--primary-color);
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 25px;
    }

    .info-presente h2 {
      font-family: var(--font-title);
      font-size: 1.2rem;
      color: var(--text-color);
      margin-bottom: 6px;
    }

    .info-presente p {
      font-size: 1.4rem;
      font-weight: 600;
      color: var(--primary-color);
    }

    .pix-box p {
      margin-bottom: 12px;
      font-size: 0.9rem;
      color: #6C7A6E;
    }

    .pix-key-wrapper {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

    .pix-key {
      width: 100%;
      padding: 12px;
      background-color: #F8F9F7;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.8rem;
      color: var(--text-color);
      word-break: break-all;
      resize: none;
      height: 70px;
      font-family: monospace;
    }

    .btn-copiar {
      width: 100%;
      padding: 12px;
      background-color: var(--accent-color);
      color: white;
      border: none;
      border-radius: 25px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: background-color 0.2s;
    }

    .btn-copiar:hover {
      background-color: var(--accent-hover);
    }

    .btn-voltar {
      display: inline-block;
      margin-top: 18px;
      color: var(--primary-color);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      padding: 8px 16px;
      border-radius: 20px;
      transition: background-color 0.2s, color 0.2s;
    }

    .btn-voltar:hover {
      background-color: #E2E8E3;
      color: var(--text-color);
    }

    @media (max-width: 480px) {
      .checkout-card {
        padding: 25px 15px;
      }
      h1 {
        font-size: 1.7rem;
      }
      .img-preview-container {
        height: 150px;
      }
    }
  </style>
</head>
<body>

  <div class="checkout-card">
    <h1>Muito Obrigado!</h1>

    <!-- Imagem do item selecionado -->
    <div class="img-preview-container" id="container-img">
      <img id="img-item" src="" alt="Item Presente" />
    </div>
    
    <div class="info-presente">
      <h2 id="nome-item">Carregando item...</h2>
      <p id="valor-item">R$ --,--</p>
    </div>

    <div class="pix-box">
      <p>Para concluir a doação, copie o código PIX abaixo e utilize a opção <strong>PIX Copia e Cola</strong> no aplicativo do seu banco:</p>
      
      <div class="pix-key-wrapper">
        <textarea id="pix-chave" class="pix-key" readonly></textarea>
        <button class="btn-copiar" onclick="copiarPix()">Copiar Código PIX</button>
      </div>
    </div>

    <!-- Botão de retorno corrigido -->
    <a href="index.html" class="btn-voltar" onclick="voltarParaLista(event)">← Escolher outro presente</a>
  </div>

  <script>
    // Mapeamento dos valores para os respectivos Códigos PIX
    const pixCodigos = {
      "100": "00020126940014br.gov.bcb.pix0114+55159915704600254Obrigada isso ira nos ajudar grandemente Lucas e Maria5204000053039865406100.005802BR5923MARIA EDUARDA SANT ANNA6007BOITUVA62580520SAN2026072401512573550300017br.gov.bcb.brcode01051.0.063042402",
      "130": "00020126940014br.gov.bcb.pix0114+55159915704600254Obrigada isso ira nos ajudar grandemente Lucas e Maria5204000053039865406130.005802BR5923MARIA EDUARDA SANT ANNA6007BOITUVA62580520SAN2026072401523734850300017br.gov.bcb.brcode01051.0.063044970",
      "140": "00020126940014br.gov.bcb.pix0114+55159915704600254Obrigada isso ira nos ajudar grandemente Lucas e Maria5204000053039865406140.005802BR5923MARIA EDUARDA SANT ANNA6007BOITUVA62580520SAN2026072401531896750300017br.gov.bcb.brcode01051.0.0630421B2",
      "150": "00020126940014br.gov.bcb.pix0114+55159915704600254Obrigada isso ira nos ajudar grandemente Lucas e Maria5204000053039865406150.005802BR5923MARIA EDUARDA SANT ANNA6007BOITUVA62580520SAN2026072401540674750300017br.gov.bcb.brcode01051.0.06304F438",
      "180": "00020126940014br.gov.bcb.pix0114+55159915704600254Obrigada isso ira nos ajudar grandemente Lucas e Maria5204000053039865406180.005802BR5923MARIA EDUARDA SANT ANNA6007BOITUVA62580520SAN2026072401544071050300017br.gov.bcb.brcode01051.0.06304AA76",
      "200": "00020126940014br.gov.bcb.pix0114+55159915704600254Obrigada isso ira nos ajudar grandemente Lucas e Maria5204000053039865406200.005802BR5923MARIA EDUARDA SANT ANNA6007BOITUVA62580520SAN2026072401551042750300017br.gov.bcb.brcode01051.0.0630462CB",
      "230": "00020126940014br.gov.bcb.pix0114+55159915704600254Obrigada isso ira nos ajudar grandemente Lucas e Maria5204000053039865406230.005802BR5923MARIA EDUARDA SANT ANNA6007BOITUVA62580520SAN2026072401555196950300017br.gov.bcb.brcode01051.0.063042B2C",
      "250": "00020126940014br.gov.bcb.pix0114+55159915704600254Obrigada isso ira nos ajudar grandemente Lucas e Maria5204000053039865406250.005802BR5923MARIA EDUARDA SANT ANNA6007BOITUVA62580520SAN2026072401563376150300017br.gov.bcb.brcode01051.0.0630452DC",
      "280": "00020126940014br.gov.bcb.pix0114+55159915704600254Obrigada isso ira nos ajudar grandemente Lucas e Maria5204000053039865406280.005802BR5923MARIA EDUARDA SANT ANNA6007BOITUVA62580520SAN2026072401571423650300017br.gov.bcb.brcode01051.0.063049992",
      "300": "00020126940014br.gov.bcb.pix0114+55159915704600254Obrigada isso ira nos ajudar grandemente Lucas e Maria5204000053039865406300.005802BR5923MARIA EDUARDA SANT ANNA6007BOITUVA62580520SAN2026072401580157350300017br.gov.bcb.brcode01051.0.063040F74",
      "350": "00020126940014br.gov.bcb.pix0114+55159915704600254Obrigada isso ira nos ajudar grandemente Lucas e Maria5204000053039865406350.005802BR5923MARIA EDUARDA SANT ANNA6007BOITUVA62580520SAN2026072401580157350300017br.gov.bcb.brcode01051.0.063040F74",
      "400": "00020126940014br.gov.bcb.pix0114+55159915704600254Obrigada isso ira nos ajudar grandemente Lucas e Maria5204000053039865406400.005802BR5923MARIA EDUARDA SANT ANNA6007BOITUVA62580520SAN2026072401584136650300017br.gov.bcb.brcode01051.0.0630456C8",
      "500": "00020126940014br.gov.bcb.pix0114+55159915704600254Obrigada isso ira nos ajudar grandemente Lucas e Maria5204000053039865406500.005802BR5923MARIA EDUARDA SANT ANNA6007BOITUVA62580520SAN2026072401593439550300017br.gov.bcb.brcode01051.0.06304EEEE",

      "800": "00020126940014br.gov.bcb.pix0114+55159915704600254Obrigada isso ira nos ajudar grandemente Lucas e Maria5204000053039865406800.005802BR5923MARIA EDUARDA SANT ANNA6007BOITUVA62580520SAN2026072402004865550300017br.gov.bcb.brcode01051.0.06304209D",
      "1000": "00020126940014br.gov.bcb.pix0114+55159915704600254Obrigada isso ira nos ajudar grandemente Lucas e Maria52040000530398654071000.005802BR5923MARIA EDUARDA SANT ANNA6007BOITUVA62580520SAN2026072402012692950300017br.gov.bcb.brcode01051.0.06304D472",
      "1800": "00020126940014br.gov.bcb.pix0114+55159915704600254Obrigada isso ira nos ajudar grandemente Lucas e Maria52040000530398654071800.005802BR5923MARIA EDUARDA SANT ANNA6007BOITUVA62580520SAN2026072402022276850300017br.gov.bcb.brcode01051.0.063044B40",
      "2000": "00020126940014br.gov.bcb.pix0114+55159915704600254Obrigada isso ira nos ajudar grandemente Lucas e Maria52040000530398654072000.005802BR5923MARIA EDUARDA SANT ANNA6007BOITUVA62580520SAN2026072402025598150300017br.gov.bcb.brcode01051.0.0630418DD"
    };

    // Lê os parâmetros transmitidos pela URL
    const urlParams = new URLSearchParams(window.location.search);
    const item = urlParams.get('item');
    const valor = urlParams.get('valor');
    const img = urlParams.get('img');

    if (item) {
      document.getElementById('nome-item').textContent = item;
    }
    if (valor) {
      document.getElementById('valor-item').textContent = `R$ ${parseFloat(valor).toLocaleString('pt-BR', { minimumFractionDigits: 2 })}`;
      
      if (pixCodigos[valor]) {
        document.getElementById('pix-chave').value = pixCodigos[valor];
      }
    }
    if (img) {
      document.getElementById('img-item').src = img;
    } else {
      document.getElementById('container-img').style.display = 'none';
    }

    function copiarPix() {
      const inputChave = document.getElementById('pix-chave');
      inputChave.select();
      inputChave.setSelectionRange(0, 99999);
      navigator.clipboard.writeText(inputChave.value);
      alert('Código PIX copiado com sucesso! Agora é só colar no seu aplicativo do banco.');
    }

    // Função para garantir o retorno à lista principal
    function voltarParaLista(event) {
      if (window.history.length > 1) {
        event.preventDefault();
        window.history.back();
      }
    }
  </script>

</body>
</html>
